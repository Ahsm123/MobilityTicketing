services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mobility
      POSTGRES_USER: mobility
      POSTGRES_PASSWORD: mobility
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./db:/docker-entrypoint-initdb.d:ro
      - .:/lab:ro

  pgweb:
    image: sosedoff/pgweb
    environment:
      PGWEB_DATABASE_URL: postgres://mobility:mobility@postgres:5432/mobility?sslmode=disable
    ports:
      - "127.0.0.1:8080:8081"
    depends_on:
      - postgres
